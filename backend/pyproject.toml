[project]
name = "tva-backend"
version = "0.1.0"
description = "TVA (Threat Variance Authority) - AI-powered email threat detection and forensic intelligence platform"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "sqlalchemy>=2.0.35",
    "psycopg[binary]>=3.2.0",
    "alembic>=1.13.0",
    "celery>=5.4.0",
    "redis>=5.1.0",
    "dkimpy>=1.1.5",
    "pyspf>=2.0.14",
    "checkdmarc>=5.0.0",
    "extract-msg>=0.54.0",
    "geoip2>=4.8.0",
    "python-multipart>=0.0.12",
    "pyyaml>=6.0.2",
    "rapidfuzz>=3.10.0",
    "beautifulsoup4>=4.12.3",
    "onnxruntime>=1.19.0",
    "tokenizers>=0.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "types-PyYAML>=6.0.12",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# This file's entire purpose is a table of Unicode characters that are
# visually confusable with Latin letters -- RUF001 flagging exactly those
# characters as "ambiguous" is correct in general and expected, not a bug,
# here.
"app/ai/confusables.py" = ["RUF001"]
"tests/ai/test_lookalike_domain.py" = ["RUF003"]
"tests/forensics/test_scoring_ai_fusion.py" = ["RUF001"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's Depends()/File()/Query() in argument defaults is the required
# idiom, not the mutable-default-argument bug B008 exists to catch.
extend-immutable-calls = ["fastapi.Depends", "fastapi.File", "fastapi.Query"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["tests/"]

[[tool.mypy.overrides]]
module = ["geoip2.*", "spf.*", "dkim.*", "checkdmarc.*", "extract_msg.*", "celery.*", "onnxruntime.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
