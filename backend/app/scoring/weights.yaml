# TVA risk-scoring weights -- the "Sacred Timeline" baseline.
#
# Edit this file to retune the score; nothing in app/scoring/engine.py is
# hardcoded. Every weight here becomes a named ScoreFactor in the API
# response, with the raw evidence that triggered it -- there is no
# unexplained number anywhere in the pipeline.
#
# Only Phase 1's deterministic signals (SPF/DKIM/DMARC, relay-chain
# anomalies) feed this today. Phase 4 adds ML-derived signals (phishing
# classifier, lookalike-domain, AI-text detection, URL analysis) into this
# same weighted-sum framework as additional entries here, not a
# replacement for it.

authentication:
  spf:
    fail: 20
    softfail: 8
    neutral: 3
    temperror: 3
    permerror: 5
  dkim:
    fail: 20
    none: 8
  dmarc:
    # A full SPF+DKIM+DMARC failure against a published p=reject policy
    # (20+20+35=75) is calibrated to clear the "malicious" threshold on
    # its own -- that combination essentially never happens for
    # legitimate mail, and is the strongest signal this deterministic-only
    # layer can produce before Phase 4 adds ML-derived signals into the
    # same sum.
    fail_by_policy:
      reject: 35
      quarantine: 20
      none: 10
      unknown: 5

# Note: an expired DKIM signature is not scored here -- generate_report()
# already turns it into a "medium" severity Anomaly (see
# forensics/report.py), which is scored by anomaly_severity below. Scoring
# it again here would double-count the same underlying fact.
anomaly_severity:
  critical: 30
  high: 20
  medium: 10
  low: 3
  info: 0

# --- Phase 4: AI-derived signals, fused into the same weighted sum ---

phishing_classifier:
  # A single flat weight above the threshold keeps the explanation
  # simple ("the classifier flagged this as phishing") rather than a
  # continuous scale that's harder to justify in one sentence. See
  # ml/README.md for the model's honestly-reported precision/recall on
  # its held-out test set -- this is not a guarantee, it's one factor
  # among many.
  probability_threshold: 0.7
  weight: 25

lookalike_domain:
  # A lookalike sender address is a stronger identity claim than a
  # lookalike link buried in the body, so it's weighted higher for the
  # same detection method.
  sender_domain:
    homoglyph_skeleton: 30
    levenshtein: 20
    jaro_winkler: 15
    brand_substring: 20
  url:
    homoglyph_skeleton: 20
    levenshtein: 12
    jaro_winkler: 10
    brand_substring: 12
  punycode_bonus: 10 # added once per domain already flagged as a lookalike

url_analysis:
  ip_literal: 12
  anchor_text_mismatch: 10
  newly_registered_domain: 15 # only ever fires with network enrichment enabled

ai_text:
  # Deliberately the smallest weight in this file -- see
  # ai_text_detection.py's module docstring for why perplexity-based
  # AI-text detection is a weak, noisy signal that must never be a
  # strong driver of the verdict on its own.
  low_perplexity_flag: 5

verdict_thresholds:
  malicious: 70
  suspicious: 30
