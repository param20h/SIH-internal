[project]
name = "tva-ml"
version = "0.1.0"
description = "TVA training pipeline: phishing classifier fine-tuning and ONNX export. Not imported by the backend at runtime -- inference there uses onnxruntime only, kept lightweight on purpose."
requires-python = ">=3.11,<3.13"
dependencies = [
    "torch>=2.4.0",
    "transformers>=4.45.0",
    "accelerate>=1.1.0",
    "scikit-learn>=1.5.0",
    "onnx>=1.16.0",
    "onnxruntime>=1.19.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
